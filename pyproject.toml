[tool.poetry]
name = "dnd-player-helper"
version = "0.1.0"
description = "Tool to support players of DnD with their character management"
authors = ["Kevin Michael Engel <kevin.m.engel@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
flet = "^0.18.0"
sqlmodel = "^0.0.14"
python-dotenv = "^1.0.1"
certifi = "^2024.2.2"
tinydb = "^4.8.0"
tqdm = "^4.66.4"
mesop = "^0.9.3"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
